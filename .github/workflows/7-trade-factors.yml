name: 7 · Trade factors (funnel, greeks, alpha/beta, peaks)

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Hard Databento budget for the whole project (USD)"
        default: "40"

permissions:
  contents: write

jobs:
  factors:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      DATABENTO_BUDGET_USD: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sharadar
          key: sharadar-v1-none
          restore-keys: sharadar-v1-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/databento
          key: dbn-v1-none
          restore-keys: dbn-v1-
      - name: Factors for every distinct agent trade
        run: python -m replay.ghrun replay.trade_factors
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/databento
          key: dbn-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: .github/scripts/commit-results.sh "trade factors"
