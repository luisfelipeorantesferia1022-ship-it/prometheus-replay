name: 5 · Agent replay (continuous 2025 book)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "variant:selector:mode triples, space separated"
        default: "sim_min1:lstm:copy sim_min1:lstm:real sim_min1:spy_rsi:real sim_min3:lstm:copy sim_min3:lstm:real sim_min3:spy_rsi:real"
      budget_usd:
        description: "Hard Databento budget for the whole project (USD)"
        default: "40"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      DATABENTO_BUDGET_USD: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sharadar
          key: sharadar-v1-none
          restore-keys: sharadar-v1-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/databento
          key: dbn-v1-none
          restore-keys: dbn-v1-
      - name: Replay
        run: |
          status=0
          for r in ${{ inputs.runs }}; do
            IFS=: read -r v sel mode <<< "$r"
            python -m replay.ghrun replay.agent --variant "$v" --selector "$sel" --mode "$mode" || status=1
          done
          exit $status
      - name: Summaries as annotations
        if: always()
        run: |
          python - <<'PY'
          import json, glob
          from replay import dbn
          for p in sorted(glob.glob("results/agent/*/*/summary.json")):
              s = json.load(open(p))
              print(f"::notice title={s.get('variant')} {s.get('selector')}/{s.get('mode')}::return {s.get('return_pct')}% | trades {s.get('n_trades')} | win {s.get('win_rate_pct')}% | maxDD {s.get('max_drawdown_pct')}% | SPY {s.get('spy_return_pct_same_window')}%")
          print(f"::notice title=Databento spend::${dbn.ledger()['spent_usd']:.2f}")
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/databento
          key: dbn-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: .github/scripts/commit-results.sh "agent replay"
