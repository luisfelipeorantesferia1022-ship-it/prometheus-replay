name: 10 · Exit paths (option price paths for sell-rule tests)

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Hard Databento budget for the whole project (USD)"
        default: "15"
      nshards:
        description: "Parallel jobs (weeks are split across them)"
        default: "20"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.nshards }}))))")" >> "$GITHUB_OUTPUT"

  paths:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      DATABENTO_BUDGET_USD: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sharadar
          key: sharadar-v1-none
          restore-keys: sharadar-v1-
          fail-on-cache-miss: true
      - run: python -m replay.ghrun replay.exit_paths --shard ${{ matrix.shard }} --nshards ${{ inputs.nshards }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-part-${{ matrix.shard }}
          path: results/analysis/exit_parts/
          if-no-files-found: ignore

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      DATABENTO_BUDGET_USD: ${{ inputs.budget_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sharadar
          key: sharadar-v1-none
          restore-keys: sharadar-v1-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/databento
          key: dbn-v1-none
          restore-keys: dbn-v1-
      - name: Agent trade paths (spend recorded separately)
        run: |
          python - <<'PY'
          import json
          from replay import dbn
          json.dump(dbn.ledger(), open("/tmp/base_ledger.json", "w"))
          PY
          python -m replay.ghrun replay.exit_paths --agent
          mkdir -p agent_out && cp results/analysis/agent_trade_paths.parquet agent_out/
          python - <<'PY'
          import json
          from replay import dbn
          b = json.load(open("/tmp/base_ledger.json")); n = dbn.ledger()
          json.dump({"spent_usd": n["spent_usd"] - b.get("spent_usd", 0),
                     "requests": n.get("requests", 0) - b.get("requests", 0),
                     "by_purpose": {k: v - b.get("by_purpose", {}).get(k, 0) for k, v in n.get("by_purpose", {}).items()}},
                    open("agent_out/spend_agent.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exit-agent
          path: agent_out/

  merge:
    needs: [paths, agent]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: exit-part-*
          path: results/analysis/exit_parts/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: exit-agent
          path: agent_out/
      - run: |
          cp agent_out/agent_trade_paths.parquet results/analysis/ || true
          cp agent_out/spend_agent.json results/analysis/exit_parts/ || true
      - run: python -m replay.ghrun replay.exit_paths --merge
      - run: rm -rf results/analysis/exit_parts agent_out && .github/scripts/commit-results.sh "exit paths"
