name: 9 · Calm-test features (Sharadar only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sharadar
          key: sharadar-v1-none
          restore-keys: sharadar-v1-
          fail-on-cache-miss: true
      - run: python -m replay.ghrun replay.calm_features
      - if: always()
        run: .github/scripts/commit-results.sh "calm-test features"
